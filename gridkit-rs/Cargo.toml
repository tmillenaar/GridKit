[package]
name = "gridkit"
version = "0.1.0"
edition = "2021"

[lib]
name = "gridkit"
crate-type = ["lib"]

[features]
default = []
# Batch the per-point grid queries over several cores with rayon. Off by
# default so consumers keep the deterministic single-threaded behaviour unless
# they opt in.
parallel = ["dep:rayon"]

[dependencies]
enum_delegate = "0.2.0"
geo-types = "0.7.12"
ndarray = "0.15.6"      # Has to match the version of ndarray used by numpy in gridkit-py/Cargo.toml. Use `cargo tree` from that dir to check
num-traits = "0.2.19"
rayon = { version = "1.12.0", optional = true }
wkb = "0.7.1"

[dev-dependencies]
bresenham = "0.1.1" # Used in examples/rotating_grid
